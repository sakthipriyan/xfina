[package]
name = "xfina"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "xfina"
path = "src/main.rs"
required-features = ["cli"]

[workspace]
resolver = "2"
members = [
    "wasm",
    "python",
    "xtask"
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sakthipriyan/xfina"
description = "Fast, privacy-first parser for Indian financial statements (ReBIT/AA standard)"
readme = "README.md"
keywords = ["finance", "parser", "account-aggregator", "india", "pdf"]
categories = ["parsing", "finance", "data-structures"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
pdf-extract = "0.7"
csv = "1.3"
wasm-bindgen = "0.2"
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
serde_with = "3"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
calamine = "0.36"
rust_decimal = { version = "1.42", features = ["serde", "serde-with-float", "serde-with-str"] }
num-traits = "0.2"
chrono-tz = "0.10"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
regex = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
pdf-extract = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
calamine = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }
chrono-tz = { workspace = true, optional = true }

# CLI Dependencies
clap = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
thiserror = "2.0.19"

[features]
default = ["all"]
all = ["ba-hdfc", "ba-icici", "ba-sbi", "ba-bob", "ba-axis", "cc-hdfc", "cc-icici", "mf-cams", "is-ibkr"]
cli = ["clap", "anyhow", "all"]

# Bank Accounts
ba-hdfc = ["calamine", "chrono", "regex", "rust_decimal"]
ba-icici = ["calamine", "chrono", "regex", "rust_decimal"]
ba-sbi = ["pdf-extract", "chrono", "regex", "rust_decimal"]
ba-bob = ["calamine", "chrono", "regex", "rust_decimal"]
ba-axis = ["calamine", "chrono", "regex", "rust_decimal"]

# Credit Cards
cc-hdfc = ["chrono", "regex", "rust_decimal", "num-traits"]
cc-icici = ["calamine", "chrono", "regex", "rust_decimal", "num-traits"]

# Mutual Funds & International Stocks
mf-cams = ["pdf-extract", "regex", "chrono", "rust_decimal"]
is-ibkr = ["csv", "chrono", "chrono-tz", "rust_decimal"]

[dev-dependencies]
serde_json = { workspace = true }

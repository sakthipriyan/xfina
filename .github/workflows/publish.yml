name: Multi-Ecosystem Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  crates_io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish xfina-models
        run: cargo publish -p xfina-models --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish Bank Accounts
        run: |
          cargo publish -p xfina-ba-axis --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          cargo publish -p xfina-ba-bob --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          cargo publish -p xfina-ba-hdfc --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          cargo publish -p xfina-ba-icici --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          cargo publish -p xfina-ba-sbi --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish Credit Cards
        run: |
          cargo publish -p xfina-cc-hdfc --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          cargo publish -p xfina-cc-icici --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish Mutual Funds & Intl Stocks
        run: |
          cargo publish -p xfina-mf-cams --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          cargo publish -p xfina-intl-stocks-ibkr --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish CLI
        run: cargo publish -p xfina-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: crates_io
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM (Bundler Target)
        working-directory: wasm
        run: wasm-pack build --target bundler
      - name: Publish to NPM
        working-directory: wasm/pkg
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: crates_io
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Maturin
        run: pip install maturin
      - name: Build and Publish Wheels
        working-directory: xfina-py
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: maturin publish --release

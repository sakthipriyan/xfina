name: Multi-Ecosystem Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_crates:
        description: 'Publish to crates.io'
        type: boolean
        default: true
      publish_npm:
        description: 'Publish to NPM'
        type: boolean
        default: true
      publish_pypi:
        description: 'Publish to PyPI'
        type: boolean
        default: true
      deploy_docs:
        description: 'Deploy Docs'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  check_branch:
    name: Verify Tag is on Main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check if tag is on main
        run: |
          git fetch origin main
          if ! git branch -r --contains ${{ github.sha }} | grep -E -q '(^|\s)origin/main$'; then
            echo "Error: Tag ${{ github.ref_name }} is not on the main branch."
            exit 1
          fi

  crates_io:
    name: Publish to crates.io
    if: github.event_name == 'push' || inputs.publish_crates != false
    needs: check_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish xfina crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --package xfina --allow-dirty

  npm:
    name: Publish to NPM
    if: github.event_name == 'push' || inputs.publish_npm != false
    runs-on: ubuntu-latest
    needs: check_branch
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack &> /dev/null; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
      - name: Build WASM (Web Target)
        working-directory: wasm
        run: wasm-pack build --target web
      - name: Publish to NPM
        working-directory: wasm/pkg
        run: |
          npm install -g npm@latest
          unset NODE_AUTH_TOKEN
          npm publish --access public --provenance

  wheels_linux:
    name: Wheels (linux ${{ matrix.target }})
    if: github.event_name == 'push' || inputs.publish_pypi != false
    needs: check_branch
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          sccache: 'true'
          working-directory: python
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: python/dist

  wheels_macos:
    name: Wheels (macos ${{ matrix.target }})
    if: github.event_name == 'push' || inputs.publish_pypi != false
    needs: check_branch
    # Both targets build on Apple Silicon: GitHub retired the macos-13 Intel
    # runner, so x86_64 is cross-compiled. Xcode ships both SDKs, so this needs
    # nothing beyond the extra rustup target that maturin-action installs.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v7
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: 'true'
          working-directory: python
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: python/dist

  wheels_windows:
    name: Wheels (windows x64)
    if: github.event_name == 'push' || inputs.publish_pypi != false
    needs: check_branch
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
          sccache: 'true'
          working-directory: python
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: python/dist

  sdist:
    name: Source distribution
    if: github.event_name == 'push' || inputs.publish_pypi != false
    needs: check_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: python
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: python/dist

  pypi_publish:
    name: Upload to PyPI
    if: github.event_name == 'push' || inputs.publish_pypi != false
    needs: [wheels_linux, wheels_macos, wheels_windows, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: List artifacts
        run: ls -l dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  deploy_docs_tag:
    name: Deploy Tagged Docs
    if: github.event_name == 'push' || inputs.deploy_docs != false
    runs-on: ubuntu-latest
    needs: [check_branch, npm]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Extract Tag Name
        id: extract_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Deploy Site via xtask
        run: cargo run -p xtask -- deploy-site --tag ${{ env.TAG_NAME }}

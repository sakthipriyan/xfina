name: Multi-Ecosystem Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  crates_io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        
      - name: Publish xfina crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --package xfina || true
          
  npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: crates_io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM (Web Target)
        working-directory: wasm
        run: wasm-pack build --target web
      - name: Publish to NPM
        working-directory: wasm/pkg
        run: |
          npm install -g npm@latest
          unset NODE_AUTH_TOKEN
          npm publish --access public --provenance

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: crates_io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Maturin
        run: pip install maturin
      - name: Build Wheels
        working-directory: python
        run: maturin build --release --out dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          skip-existing: true

  deploy_docs:
    name: Deploy Versioned Docs
    runs-on: ubuntu-latest
    needs: crates_io
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract Tag Name
        id: extract_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM
        run: wasm-pack build wasm --target web --out-dir ../web/src/wasm
      - name: Install JS Dependencies
        working-directory: web
        run: npm ci
      - name: Build Vue App for Tag
        working-directory: web
        env:
          VITE_BASE_URL: /${{ env.TAG_NAME }}/
        run: npm run build
      - name: Deploy to gh-pages branch subdirectory
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: ${{ env.TAG_NAME }}
          keep_files: true

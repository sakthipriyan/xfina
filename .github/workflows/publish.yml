name: Multi-Ecosystem Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  crates_io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish xfina-models
        run: cargo publish -p xfina-models --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || true
      - name: Publish Bank Accounts
        run: |
          sleep 15
          cargo publish -p xfina-ba-axis --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || true
          sleep 15
          cargo publish -p xfina-ba-bob --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || true
          sleep 15
          cargo publish -p xfina-ba-hdfc --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || true
          sleep 15
          cargo publish -p xfina-ba-icici --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || true
          sleep 15
          cargo publish -p xfina-ba-sbi --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || true
      - name: Publish Credit Cards
        run: |
          sleep 15
          cargo publish -p xfina-cc-hdfc --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || true
          sleep 15
          cargo publish -p xfina-cc-icici --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || true
      - name: Publish Mutual Funds & Intl Stocks
        run: |
          sleep 15
          cargo publish -p xfina-mf-cams --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || true
          sleep 15
          cargo publish -p xfina-intl-stocks-ibkr --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || true
      - name: Publish xfina & xfina-cli
        run: |
          sleep 15
          cargo publish -p xfina --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || true
          sleep 15
          cargo publish -p xfina-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || true

  npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: crates_io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM (Web Target)
        working-directory: wasm
        run: wasm-pack build --target web
      - name: Publish to NPM
        working-directory: wasm/pkg
        run: npm publish --access public --provenance

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: crates_io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Maturin
        run: pip install maturin
      - name: Build Wheels
        working-directory: python
        run: maturin build --release --out dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          skip-existing: true

  deploy_docs:
    name: Deploy Versioned Docs
    runs-on: ubuntu-latest
    needs: crates_io
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract Tag Name
        id: extract_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM
        run: wasm-pack build wasm --target web --out-dir ../web/src/wasm
      - name: Install JS Dependencies
        working-directory: web
        run: npm ci
      - name: Build Vue App for Tag
        working-directory: web
        env:
          VITE_BASE_URL: /${{ env.TAG_NAME }}/
        run: npm run build
      - name: Deploy to gh-pages branch subdirectory
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: ${{ env.TAG_NAME }}
          keep_files: true

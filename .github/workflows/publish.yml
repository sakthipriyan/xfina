name: Multi-Ecosystem Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_crates:
        description: 'Publish to crates.io'
        type: boolean
        default: true
      publish_npm:
        description: 'Publish to NPM'
        type: boolean
        default: true
      publish_pypi:
        description: 'Publish to PyPI'
        type: boolean
        default: true
      deploy_docs:
        description: 'Deploy Docs'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  check_branch:
    name: Verify Tag is on Main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if tag is on main
        run: |
          if ! git branch -r --contains ${{ github.sha }} | grep -E -q '(^|\s)origin/main$'; then
            echo "Error: Tag ${{ github.ref_name }} is not on the main branch."
            exit 1
          fi

  crates_io:
    name: Publish to crates.io
    if: inputs.publish_crates != false
    needs: check_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Publish xfina crate
        run: |
          OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=crates.io" | jq -r .value)
          CRATES_TOKEN=$(curl -sS -X POST https://crates.io/api/v1/authenticate/trusted_publisher \
            -H "Content-Type: application/json" \
            -d "{\"jwt\": \"$OIDC_TOKEN\"}" | jq -r .token)
          cargo publish --package xfina --allow-dirty --token "$CRATES_TOKEN"

  npm:
    name: Publish to NPM
    if: inputs.publish_npm != false
    runs-on: ubuntu-latest
    needs: check_branch
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack &> /dev/null; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
      - name: Build WASM (Web Target)
        working-directory: wasm
        run: wasm-pack build --target web
      - name: Publish to NPM
        working-directory: wasm/pkg
        run: |
          npm install -g npm@latest
          unset NODE_AUTH_TOKEN
          npm publish --access public --provenance

  pypi:
    name: Publish to PyPI
    if: inputs.publish_pypi != false
    runs-on: ubuntu-latest
    needs: check_branch
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Maturin
        run: pip install maturin
      - name: Build Wheels
        working-directory: python
        run: maturin build --release --out dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          skip-existing: true

  deploy_docs_tag:
    name: Deploy Tagged Docs
    if: inputs.deploy_docs != false
    runs-on: ubuntu-latest
    needs: check_branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Extract Tag Name
        id: extract_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Deploy Site via xtask
        run: cargo run -p xtask -- deploy-site --tag ${{ env.TAG_NAME }}
